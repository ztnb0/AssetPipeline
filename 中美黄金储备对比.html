<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>对比中美黄金储备 · 2021.06–2026.07</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F0EFEB;--ink:#1C1C1A;--muted:#8F8E88;--faint:#C6C5BF;--grid:#DEDDD6}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;
    color:var(--ink);padding:44px 20px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto}
  .card{background:var(--bg);border-radius:24px;padding:30px 30px 20px}
  h2{font-weight:700;font-size:18px;letter-spacing:-.01em;margin-bottom:4px;line-height:1.4}
  .sub{font-size:12px;color:var(--muted);margin-bottom:6px}
  .src{font-size:9.5px;color:var(--faint);margin-top:6px;letter-spacing:.05em;font-weight:500;line-height:1.7}
  svg{width:100%;height:auto;display:block;margin:0 auto}
  svg text{font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif}
  .fade{animation:fade .9s ease both}
  @keyframes fade{from{opacity:0}}
  .pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.7,.3,1.3) both}
  @keyframes pop{from{transform:scale(0)}to{transform:none}}
  .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s cubic-bezier(.4,0,.2,1) both}
  @keyframes draw{to{stroke-dashoffset:0}}
  @media (prefers-reduced-motion:reduce){
    .pop,.fade{animation:none}
    .draw{animation:none;stroke-dasharray:none;stroke-dashoffset:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h2>对比中美黄金储备：美国 8,133 吨五年未动，中国一路增持到 2,366 吨</h2>
    <div class="sub">墨线 = 中国（中国人民银行） · 灰线 = 美国（美国财政部，区间内为同一常值） · 单位：吨 · 逐月 · 2021.06 — 2026.07</div>
    <svg id="ch" viewBox="0 0 820 380" preserveAspectRatio="xMidYMid meet" role="img" aria-label="2021年6月至2026年7月中国与美国央行黄金储备量逐月对比折线图"></svg>
    <div class="src">F2 HAIRLINE LINE · MONO-BASIC · 中国 = AKShare（中国人民银行逐月官方序列，万盎司折算吨） · 美国 = 美国财政部金库存量（2021—2026 年不变，约 261,498,926 盎司） · 数据截至 2026-07 · 每点一月，悬停可读值</div>
  </div>
</div>
<script>
(function(g){'use strict';
  const INK='#1C1C1A',PAPER='#F0EFEB',MUTED='#8F8E88',FAINT='#C6C5BF',GRID='#DEDDD6';
  const NS='http://www.w3.org/2000/svg';
  const el=(p,t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);p.appendChild(n);return n};
  const txt=(p,a,s)=>{const n=el(p,'text',a);n.textContent=s;return n};
  const tip=(n,s)=>{const t=document.createElementNS(NS,'title');t.textContent=s;n.appendChild(t)};
  const timers={};
  const obsReveal=(id,fn)=>{
    const n=document.getElementById(id);
    const go=()=>{(timers[id]||[]).forEach(clearInterval);timers[id]=[];
      if(n.tagName==='svg'||n.tagName==='SVG')n.innerHTML='';fn(n)};
    const io=new IntersectionObserver(es=>{if(es[0].isIntersecting){go();io.disconnect()}},{threshold:.3});
    io.observe(n);n.style.cursor='pointer';n.addEventListener('click',go);
  };
  g.MONO={INK,PAPER,MUTED,FAINT,GRID,el,txt,tip,obsReveal};
})(window);

(()=>{
const MONO=window.MONO;const el=MONO.el,txt=MONO.txt,tip=MONO.tip;
const s=document.getElementById('ch');
const N=62;
const CN=[1948.32,1948.32,1948.32,1948.32,1948.32,1948.32,1948.32,1948.32,1948.32,1948.32,1948.32,1948.32,1948.32,1948.32,1948.32,1948.32,1948.32,1980.36,2010.53,2025.46,2050.34,2068.38,2076.47,2092.33,2113.48,2136.50,2165.42,2191.55,2214.57,2226.39,2235.41,2245.36,2257.49,2262.47,2264.33,2264.33,2264.33,2264.33,2264.33,2264.33,2264.33,2269.31,2279.57,2284.55,2289.53,2292.33,2294.50,2296.37,2298.55,2300.41,2302.28,2303.52,2304.46,2305.39,2306.32,2307.57,2308.50,2313.48,2321.56,2331.52,2346.45,2366.35];
const US=8133.5;
const MONTHS=['2021-06','2021-07','2021-08','2021-09','2021-10','2021-11','2021-12','2022-01','2022-02','2022-03','2022-04','2022-05','2022-06','2022-07','2022-08','2022-09','2022-10','2022-11','2022-12','2023-01','2023-02','2023-03','2023-04','2023-05','2023-06','2023-07','2023-08','2023-09','2023-10','2023-11','2023-12','2024-01','2024-02','2024-03','2024-04','2024-05','2024-06','2024-07','2024-08','2024-09','2024-10','2024-11','2024-12','2025-01','2025-02','2025-03','2025-04','2025-05','2025-06','2025-07','2025-08','2025-09','2025-10','2025-11','2025-12','2026-01','2026-02','2026-03','2026-04','2026-05','2026-06','2026-07'];
const X=d=>64+d*11.8;                 // x(0)=64 … x(61)≈783.8
const Y=v=>44+(9000-v)*(312-44)/9000; // 0 t → 312, 9000 t → 44
const BASE=312;

MONO.obsReveal('ch',sv=>{
  // horizontal value grid + faint hairline floor ticks for every month
  [[2000,Y(2000)],[4000,Y(4000)],[6000,Y(6000)],[8000,Y(8000)]].forEach(([gv,y],gi)=>{
    el(sv,'line',{x1:64,y1:y,x2:784,y2:y,stroke:MONO.GRID,'stroke-width':.7,
      class:'fade',style:`animation-delay:${gi*.04}s`});
    txt(sv,{x:58,y:y+3,'font-size':7.5,'font-weight':600,fill:'#B0AFA9','text-anchor':'end',
      class:'fade',style:`animation-delay:${gi*.04}s`},gv.toLocaleString('en-US'));
  });
  // barcode calendar floor: one hairline tick per month, then the baseline
  for(let d=0;d<N;d++)
    el(sv,'line',{x1:X(d),y1:BASE,x2:X(d),y2:BASE-6,stroke:'#C9C8C1','stroke-width':.6,
      class:'fade',style:`animation-delay:${d*.005}s`});
  el(sv,'line',{x1:60,y1:BASE,x2:788,y2:BASE,stroke:MONO.GRID,'stroke-width':.8,class:'fade'});
  [[0,'2021.06'],[12,'2022.06'],[24,'2023.06'],[36,'2024.06'],[48,'2025.06'],[61,'2026.07']].forEach(([d,m])=>
    txt(sv,{x:X(d),y:BASE+16,'font-size':8,'font-weight':600,fill:MONO.MUTED,'text-anchor':'middle',
      'letter-spacing':'.02em',class:'fade'},m));

  // ── US: a single flat line — the value never changed across the window ──
  el(sv,'line',{x1:X(0),y1:Y(US),x2:X(N-1),y2:Y(US),stroke:'#6A6963','stroke-width':1.2,pathLength:1,
    class:'draw',style:'animation-delay:.25s;animation-duration:1s'});
  // invisible monthly beads so every month is a real, hoverable record
  for(let d=0;d<N;d++){
    const hit=el(sv,'circle',{cx:X(d),cy:Y(US),r:6,fill:'none','pointer-events':'all'});
    tip(hit,`${MONTHS[d]} · 美国 ${US.toLocaleString('en-US')} 吨（整段未变）`);
  }
  const usL=txt(sv,{x:X(N-1),y:Y(US)-12,'font-size':9,'font-weight':800,fill:'#6A6963','text-anchor':'end',
    style:`paint-order:stroke;stroke:${MONO.PAPER};stroke-width:3.5px;animation-delay:.6s`,
    class:'fade'},'美国 8,133 吨');
  tip(usL,'美国 · 8,133 吨 · 2021—2026 保持不变');

  // ── China: hairline path, one inked dot per official monthly reading ──
  const pts=CN.map((v,d)=>`${X(d)} ${Y(v)}`).join(' L ');
  el(sv,'path',{d:'M'+pts,fill:'none',stroke:MONO.INK,'stroke-width':1.4,pathLength:1,
    class:'draw',style:'animation-duration:1.4s'});
  CN.forEach((v,d)=>{
    const dot=el(sv,'circle',{cx:X(d),cy:Y(v),r:1.9,fill:MONO.INK,
      class:'fade',style:`animation-delay:${.25+d*.012}s`});
    tip(dot,`${MONTHS[d]} · 中国 ${v.toLocaleString('en-US')} 吨`);
    const hit=el(sv,'circle',{cx:X(d),cy:Y(v),r:5,fill:'none','pointer-events':'all'});
    tip(hit,`${MONTHS[d]} · 中国 ${v.toLocaleString('en-US')} 吨`);
  });

  // start & end callouts
  const d0=0,d1=N-1;
  el(sv,'circle',{cx:X(d0),cy:Y(CN[d0]),r:4,fill:MONO.INK,class:'pop',style:'animation-delay:.9s'});
  const l0=txt(sv,{x:X(d0)+2,y:Y(CN[d0])+18,'font-size':9,'font-weight':800,fill:MONO.INK,'text-anchor':'start',
    style:`paint-order:stroke;stroke:${MONO.PAPER};stroke-width:3.5px;animation-delay:.95s`,
    class:'fade'},'1,948 吨');
  tip(l0,'2021-06 · 中国 1,948.3 吨');
  el(sv,'circle',{cx:X(d1),cy:Y(CN[d1]),r:4.6,fill:MONO.INK,class:'pop',style:'animation-delay:1.15s'});
  const l1=txt(sv,{x:X(d1)-2,y:Y(CN[d1])-13,'font-size':9.5,'font-weight':800,fill:MONO.INK,'text-anchor':'end',
    style:`paint-order:stroke;stroke:${MONO.PAPER};stroke-width:3.5px;animation-delay:1.2s`,
    class:'fade'},'2,366 吨');
  tip(l1,'2026-07 · 中国 2,366.4 吨');

  // gain band: the +418 t the chart is really about
  el(sv,'line',{x1:X(d1),y1:Y(CN[d1]),x2:X(d1),y2:Y(CN[d0]),stroke:'#8F8E88','stroke-width':1,
    'stroke-dasharray':'2 3',opacity:.8,class:'fade',style:'animation-delay:1.5s'});
  txt(sv,{x:X(d1)-10,y:(Y(CN[d1])+Y(CN[d0]))/2+3,'font-size':8,'font-weight':700,fill:'#6A6963','text-anchor':'end',
    style:`paint-order:stroke;stroke:${MONO.PAPER};stroke-width:3px;animation-delay:1.55s`,
    class:'fade'},'+418 吨');
});
})();
</script>
</body>
</html>
